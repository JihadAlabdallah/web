<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nook – Book your escape</title>
  <link rel="stylesheet" href="homepage.css">
</head>
<body>
  <div class="page">

    <!-- Header -->
    <header class="header">
      <a href="#" class="logo">NOOK</a>

      <nav class="nav">
        <a href="#" class="nav__link">Book</a>
        <a href="#" class="nav__link">Dine</a>
        <a href="#" class="nav__link">Explore</a>
        <a href="#" class="nav__link">List your place</a>
      </nav>

      <button class="btn btn--primary btn--small" type="button">Get the app</button>
    </header>

    <main>
      <!-- Hero -->
      <section class="hero">
        <h1 class="hero__title">Book your escape.</h1>
        <p class="hero__subtitle">Guest houses, restaurants and things to do all in one nook.</p>

        <div class="search">
          <input class="search__input" type="text" placeholder="Search a location or stay">
          <button class="btn btn--primary btn--pill" type="button">Search</button>
        </div>
      </section>

      <!-- Popular destinations -->
      <section class="destinations">
        <h2 class="destinations__title">Popular destinations</h2>

        <div class="destinations__grid">
          <article class="card">
            <div class="card__image card__image--1"></div>
            <p class="card__name">Kfarmatta</p>
          </article>

          <article class="card">
            <div class="card__image card__image--2"></div>
            <p class="card__name">Baisour</p>
          </article>

          <article class="card">
            <div class="card__image card__image--3"></div>
            <p class="card__name">Aley</p>
          </article>
        </div>
      </section>
    </main>

    <!-- App banner -->
    <footer class="app-banner">
      <p class="app-banner__text">Nook lives in your pocket</p>

      <div class="app-banner__stores">
        <a href="#" class="store-badge">App Store</a>
        <a href="#" class="store-badge">Google Play</a>
      </div>
    </footer>

  </div>
</body>
</html>
